# helm upgrade --install kps prometheus-community/kube-prometheus-stack -n monitoring -f this-file
fullnameOverride: kps

prometheus:
  prometheusSpec:
    retention: 3d
    enableFeatures: ["exemplar-storage"]       # keep trace_id exemplars from OpenMetrics scrapes
    enableRemoteWriteReceiver: true             # Tempo metrics-generator writes service-graph metrics here
    scrapeInterval: 15s
    # pick up ServiceMonitors / PodMonitors / PrometheusRules from every namespace, no special labels needed
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 10Gi } }

alertmanager:
  alertmanagerSpec:
    # The Slack webhook URL lives in a Secret created out-of-band (never in Git):
    #   kubectl -n monitoring create secret generic alertmanager-slack --from-literal=url='https://hooks.slack.com/services/...'
    secrets: ["alertmanager-slack"]
    resources:
      requests: { cpu: 20m, memory: 64Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 2h
      routes:
        - receiver: "null"
          matchers: ['alertname=~"Watchdog|InfoInhibitor"']
        - receiver: slack
          matchers: ['severity=~"critical|warning"']
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: ["alertname", "namespace"]
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            channel: "#shoplite-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              Started: {{ .StartsAt }}
              {{ end }}

# Control-plane components on kubeadm listen on localhost — don't alert on unreachable targets we can't scrape
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

grafana:
  adminUser: admin
  # adminPassword comes from the secret below (create it before installing):
  #   kubectl -n monitoring create secret generic grafana-admin --from-literal=admin-user=admin --from-literal=admin-password='<strong password>'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
    datasources:
      enabled: true
      uid: prometheus
      # exemplars on Prometheus panels link straight to the Tempo trace
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000
        derivedFields:
          # every JSON log line has "trace_id": "<32 hex>" -> clickable link to Tempo
          - name: trace_id
            matcherRegex: '"trace_id":\s*"(\w{32})"'
            datasourceUid: tempo
            url: '$${__value.raw}'
            urlDisplayLabel: "Open trace in Tempo"
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: false
          customQuery: true
          query: '{namespace=~"shoplite.*"} |= "$${__trace.traceId}"'
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags: [{ key: "service.name", value: "service" }]
          queries:
            - name: Request rate
              query: 'sum(rate(http_requests_total{$$__tags}[1m]))'
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        search:
          hide: false
        lokiSearch:
          datasourceUid: loki
  grafana.ini:
    feature_toggles:
      enable: traceToMetrics
