apiVersion: v1
kind: ConfigMap
metadata:
  name: shoplite-config
  labels:
    {{- include "shoplite.labels" (dict "root" . "component" "config") | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.catalogApi.logLevel | quote }}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_POOL_MAX: {{ .Values.catalogApi.dbPoolMax | quote }}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_NAME: "orders:pending"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  WORKER_CONCURRENCY: {{ .Values.orderWorker.concurrency | quote }}
  # ---- fault injection (Question 8) ----
  CHAOS_LATENCY_MS: {{ .Values.catalogApi.chaos.latencyMs | quote }}
  CHAOS_ERROR_RATE: {{ .Values.catalogApi.chaos.errorRate | quote }}
  CHAOS_MEMORY_LEAK: {{ .Values.orderWorker.chaos.memoryLeak | quote }}
  CHAOS_SLOW_DB: {{ .Values.orderWorker.chaos.slowDb | quote }}
