# Lint -> test -> build -> Trivy scan -> (main only) push to ECR via OIDC -> bump image tag in shoplite-gitops.
# This pipeline NEVER talks to the cluster (no kubectl). ArgoCD deploys from Git.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "linux/evidence/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  IMAGE_PREFIX: shoplite

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (all Dockerfiles)
        run: |
          for f in services/*/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f"
            echo "::endgroup::"
          done
      - uses: azure/setup-helm@v4
      - name: helm lint (dev + prod values)
        run: |
          helm lint helm/shoplite -f helm/shoplite/values-dev.yaml
          helm lint helm/shoplite -f helm/shoplite/values-prod.yaml
          helm template shoplite helm/shoplite -f helm/shoplite/values-prod.yaml > /dev/null
      - name: shellcheck
        run: shellcheck scripts/*.sh linux/scripts/*.sh linux/firewall/*.sh
      - name: Validate dashboards are valid JSON
        run: for f in monitoring/dashboards/*.json; do jq empty "$f"; done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-api, order-worker]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC -> AWS, no long-lived keys
    strategy:
      fail-fast: true
      matrix:
        service: [web, catalog-api, order-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: img
        run: |
          REG="${{ steps.ecr.outputs.registry }}"
          [ -z "$REG" ] && REG="local"
          echo "ref=${REG}/${IMAGE_PREFIX}/${{ matrix.service }}:${{ steps.vars.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.vars.outputs.sha }} \
            -t "${{ steps.img.outputs.ref }}" services/${{ matrix.service }}

      - name: Image must be < 150 MB
        run: |
          size=$(docker image inspect "${{ steps.img.outputs.ref }}" --format '{{.Size}}')
          echo "image size: $((size/1024/1024)) MB"
          [ "$size" -lt $((150*1024*1024)) ]

      - name: Trivy scan (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress \
            "${{ steps.img.outputs.ref }}"

      - name: Push to ECR
        if: github.event_name == 'push'
        run: docker push "${{ steps.img.outputs.ref }}"

  update-gitops:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout shoplite-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/shoplite-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Bump image tag (dev auto-syncs, prod waits for a manual ArgoCD sync)
        working-directory: gitops
        run: |
          for env in dev prod; do
            yq -i ".image.tag = \"${{ steps.vars.outputs.sha }}\"" "envs/${env}/values.yaml"
          done
          git config user.name  "shoplite-ci"
          git config user.email "shoplite-ci@users.noreply.github.com"
          git add envs/
          git diff --cached --quiet && { echo "nothing to change"; exit 0; }
          git commit -m "deploy: shoplite ${{ steps.vars.outputs.sha }}"
          git push
