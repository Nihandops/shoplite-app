# helm upgrade --install tempo grafana/tempo -n monitoring -f this-file
tempo:
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kps-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
persistence:
  enabled: true
  size: 10Gi
