# App-of-apps. Apply ONCE by hand (this is cluster bootstrap, not CI):
#   kubectl apply -n argocd -f bootstrap/root-app.yaml
# After that every change happens through Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nihandops/shoplite-gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
