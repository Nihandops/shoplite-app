- name: Kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: Kubeadm init (only once)
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf

- name: ~/.kube dir
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    mode: "0700"

- name: Kubeconfig for ubuntu
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Calico operator (CNI with NetworkPolicy enforcement)
  ansible.builtin.command: >
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side
    -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  register: control_plane_operator
  changed_when: "'serverside-applied' in control_plane_operator.stdout"

- name: Wait for Calico CRDs
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Established crd/installations.operator.tigera.io --timeout=120s
  changed_when: false

- name: Calico installation (VXLAN, pod CIDR)
  ansible.builtin.template:
    src: calico-installation.yaml.j2
    dest: /etc/kubernetes/calico-installation.yaml
    mode: "0644"

- name: Apply Calico installation
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /etc/kubernetes/calico-installation.yaml
  register: control_plane_calico
  changed_when: "'created' in control_plane_calico.stdout or 'configured' in control_plane_calico.stdout"

- name: Join command for workers
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
  register: control_plane_join_cmd
  changed_when: false

- name: Share join command
  ansible.builtin.set_fact:
    control_plane_join_command: "{{ control_plane_join_cmd.stdout }}"

- name: Fetch kubeconfig to the Ansible controller
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Point local kubeconfig at the SSM tunnel (127.0.0.1:6443)
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ kubeconfig_local_path }}"
    regexp: 'server: https://.*:6443'
    replace: 'server: https://127.0.0.1:6443'
